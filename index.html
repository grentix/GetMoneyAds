
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Monetag SDK -->
<script src="https://libtl.com/sdk.js"
data-zone="12218302"
data-sdk="show_12218302"></script>

<title>GetMoneyAds</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px 18px;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 480px;
  margin: auto;
}

.header {
  text-align: center;
  padding: 25px 10px;
}

.header h1 { color: #42a5ff; }

.card {
  background: #1d293b;
  padding: 22px;
  border-radius: 16px;
  margin-bottom: 16px;
}

.info {
  color: #aab8cc;
  font-size: 14px;
  line-height: 1.6;
}

button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 10px;
  background: #1688e8;
  color: white;
  font-size: 16px;
  font-weight: bold;
  margin-top: 15px;
}

button:disabled {
  opacity: 0.5;
}

#status {
  margin-top: 15px;
  font-size: 13px;
  color: #aab8cc;
}

.footer {
  text-align: center;
  color: #78899f;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>
<div class="container">

  <div class="header">
    <h1>GetMoneyAds</h1>
    <p class="info">Advertisement Platform</p>
  </div>

  <div class="card">
    <h3>Welcome!</h3>
    <p class="info">
      Watch available advertisements on GetMoneyAds.
    </p>
  </div>

  <div class="card">
    <h3>Sponsored Advertisement</h3>
    <p class="info">
      Press the button below to open a rewarded advertisement.
    </p>

    <button id="watchButton" onclick="watchAd()">
      Watch Advertisement
    </button>

    <div id="status"></div>
  </div>

  <div class="footer">
    GetMoneyAds Platform
  </div>

</div>

<script>
if (window.Telegram && window.Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}

async function watchAd() {
  const button = document.getElementById("watchButton");
  const status = document.getElementById("status");

  if (typeof window.show_12218302 !== "function") {
    status.textContent = "Advertisement is not available yet.";
    return;
  }

  button.disabled = true;
  status.textContent = "Loading advertisement...";

  try {
    await window.show_12218302();
    status.textContent = "Advertisement session completed. Reward verification is pending.";
  } catch (error) {
    status.textContent = "Advertisement could not be completed. Please try again later.";
  } finally {
    button.disabled = false;
  }
}
</script>

</body>
</html>
